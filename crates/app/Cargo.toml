[package]
name = "dragon-gui"
description = "Dragon Agent desktop app, built with GPUI (Zed's GPU-accelerated UI framework)."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "dragon-gui"
path = "src/main.rs"

[dependencies]
dragon-core = { path = "../core" }
gpui = "0.2"
anyhow = "1"
serde_json = "1"
unicode-segmentation = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[package.metadata.notes]
identity = "native GPUI rewrite - declarative styled UI, retained entities, no web stack"
