[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["mamad720220 <@mamad720220>"]
repository = "https://github.com/mamad7202202/dragon-agent"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
