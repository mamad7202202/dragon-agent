name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli: dragon-x86_64-windows.exe
            gui: dragon-gui-x86_64-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: dragon-x86_64-linux
            gui: dragon-gui-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            cli: dragon-aarch64-macos
            gui: dragon-gui-aarch64-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release (cli + gui)
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ext = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/${{ matrix.target }}/release/dragon$ext" "dist/${{ matrix.cli }}"
          Copy-Item "target/${{ matrix.target }}/release/dragon-gui$ext" "dist/${{ matrix.gui }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Rolling "latest" release refreshed on every push to main.
  nightly:
    name: Publish latest (rolling)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Make unix binaries executable
        run: |
          chmod +x dist/dragon-x86_64-linux dist/dragon-aarch64-macos \
                   dist/dragon-gui-x86_64-linux dist/dragon-gui-aarch64-macos

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto)
          prerelease: true
          files: dist/*
          overwrite_files: true
          allow_updates: true
          body: |
            Rolling build of `main`. Raw executables - CLI and desktop app share one core.

            | file | what | platform |
            |---|---|---|
            | `dragon-x86_64-windows.exe` | terminal agent | Windows x64 |
            | `dragon-gui-x86_64-windows.exe` | desktop app | Windows x64 |
            | `dragon-x86_64-linux` | terminal agent | Linux x64 |
            | `dragon-gui-x86_64-linux` | desktop app | Linux x64 |
            | `dragon-aarch64-macos` | terminal agent | macOS Apple Silicon |
            | `dragon-gui-aarch64-macos` | desktop app | macOS Apple Silicon |

            Install the CLI with one line:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/mamad7202202/dragon-agent/main/install.sh | sh
            ```
            ```powershell
            irm https://raw.githubusercontent.com/mamad7202202/dragon-agent/main/install.ps1 | iex
            ```

  # Formal releases for version tags.
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Make unix binaries executable
        run: |
          chmod +x dist/dragon-x86_64-linux dist/dragon-aarch64-macos \
                   dist/dragon-gui-x86_64-linux dist/dragon-gui-aarch64-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
