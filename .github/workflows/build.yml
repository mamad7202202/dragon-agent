name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dragon-x86_64-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dragon-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dragon-aarch64-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --target ${{ matrix.target }} --workspace

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage raw executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dragon${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Rolling "latest" release refreshed on every push to main.
  # Install scripts fetch binaries straight from this release.
  nightly:
    name: Publish latest (rolling)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Make unix binaries executable
        run: |
          chmod +x dist/dragon-x86_64-linux dist/dragon-aarch64-macos

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto)
          prerelease: true
          files: dist/*
          overwrite_files: true
          allow_updates: true
          body: |
            Rolling build of `main`. Raw executables, no archives.

            | file | platform |
            |---|---|
            | `dragon-x86_64-windows.exe` | Windows 10/11 x64 |
            | `dragon-x86_64-linux` | Linux x64 (glibc) |
            | `dragon-aarch64-macos` | macOS Apple Silicon |

            Install with one line:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/mamad7202202/dragon-agent/main/install.sh | sh
            ```
            ```powershell
            irm https://raw.githubusercontent.com/mamad7202202/dragon-agent/main/install.ps1 | iex
            ```

  # Formal releases for version tags.
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Make unix binaries executable
        run: |
          chmod +x dist/dragon-x86_64-linux dist/dragon-aarch64-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
