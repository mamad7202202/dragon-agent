name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dragon-windows-x64
            ext: .exe
            pack: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dragon-linux-x64
            ext: ""
            pack: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dragon-macos-arm64
            ext: ""
            pack: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --target ${{ matrix.target }} --workspace

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/dragon${{ matrix.ext }}" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (tar.gz)
        if: matrix.pack == 'tar'
        run: |
          chmod +x "target/${{ matrix.target }}/release/dragon"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "target/${{ matrix.target }}/release" dragon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
