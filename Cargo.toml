[package]
name = "dragon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["mamad720220 <@mamad720220>"]
description = "Dragon Agent - a fast, open-source AI agent for your terminal with a hybrid memory system."
license = "MIT"
repository = "https://github.com/mamad720220/dragon-agent"
readme = "README.md"
keywords = ["ai", "agent", "llm", "tui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "dragon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"
futures-util = "0.3"
bytes = "1"
regex = "1"
async-trait = "0.1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
