name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli: dragon-x86_64-windows.exe
            gui: dragon-gui-x86_64-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: dragon-x86_64-linux
            gui: dragon-gui-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            cli: dragon-aarch64-macos
            gui: dragon-gui-aarch64-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install webview deps (desktop app on linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
               libayatana-appindicator3-dev librsvg2-dev

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release (cli + gui)
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ext = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/${{ matrix.target }}/release/dragon$ext" "dist/${{ matrix.cli }}"
          Copy-Item "target/${{ matrix.target }}/release/dragon-gui$ext" "dist/${{ matrix.gui }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Versioned releases, opencode-style: push a tag `vX.Y.Z` and every
  # platform's raw executable lands on that release, plus a checksums file.
  # The in-app updater reads tags from this stream.
  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Make unix binaries executable
        run: chmod +x dist/dragon-*linux dist/dragon-*macos

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
